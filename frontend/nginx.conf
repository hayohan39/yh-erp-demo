server {
    listen 80;
    root /usr/share/nginx/html;

    # 시뮬레이터 제어(시작·정지·배속·데모 초기화 등)는 로그인한 사용자만.
    # 요청의 Authorization 헤더로 백엔드 /api/auth/me 를 먼저 확인한다.
    location /api/sim/ {
        auth_request /_auth;
        proxy_pass http://simulator:8100;
    }

    location = /_auth {
        internal;
        proxy_pass http://backend:8000/api/auth/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    # 데모 초기화 API는 시뮬레이터가 내부망에서만 호출한다. 외부에서 직접 부르는 것은 막는다.
    location = /api/admin/reset {
        return 403;
    }

    location /api/events {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri /index.html;
    }
}
