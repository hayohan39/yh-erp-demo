# YH 통합 ERP 시뮬레이션 데모 — 클라우드 VM 1대에서 전체 스택 실행
# 외부에는 web(80)만 열고, DB·API는 내부 네트워크로만 통신한다.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-erp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 .env에 설정하세요}
      POSTGRES_DB: erp
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-erp} -d erp"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${DB_USER:-erp}:${DB_PASSWORD}@db:5432/erp
      LEGACY_OUTBOUND_URL: http://simulator:8100/api/sim/inbound
    depends_on:
      db:
        condition: service_healthy

  simulator:
    build: ./simulator
    restart: unless-stopped
    environment:
      ERP_URL: http://backend:8000
    depends_on:
      - backend

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - backend
      - simulator

volumes:
  db-data:
