# YH 통합 ERP 시뮬레이션 데모 — 클라우드 VM 1대에서 전체 스택 실행
# 외부에는 web(80)만 열고, DB·API는 내부 네트워크로만 통신한다.
# 서버 배포 시에는 https 프로필로 caddy가 80/443을 맡아 HTTPS(자동 인증서)를 제공하고,
# web은 서버 내부(127.0.0.1:8080)에만 연다.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-erp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 .env에 설정하세요}
      POSTGRES_DB: erp
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-erp} -d erp"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${DB_USER:-erp}:${DB_PASSWORD}@db:5432/erp
      LEGACY_OUTBOUND_URL: http://simulator:8100/api/sim/inbound
    depends_on:
      db:
        condition: service_healthy

  simulator:
    build: ./simulator
    restart: unless-stopped
    environment:
      ERP_URL: http://backend:8000
    depends_on:
      - backend

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - backend
      - simulator

  caddy:
    image: caddy:2.8-alpine
    profiles: ["https"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web

volumes:
  caddy-data:
  caddy-config:
  db-data:
