name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  compose:
    # PostgreSQL을 포함한 전체 스택을 실제로 띄워 I/F 흐름을 확인한다.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      DB_PASSWORD: CiErp12345
      WEB_PORT: "8080"
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - name: 헬스체크
        run: |
          for i in $(seq 1 60); do curl -fsS localhost:8080/api/health && exit 0; sleep 5; done
          docker compose logs; exit 1
      - name: 로그인 (시뮬레이터 제어 API는 로그인 토큰 필요)
        run: |
          TOKEN=$(curl -fsS -X POST localhost:8080/api/auth/login -H 'content-type: application/json' \
            -d '{"username":"admin","password":"admin"}' | python3 -c 'import json,sys;print(json.load(sys.stdin)["token"])')
          echo "::add-mask::$TOKEN"
          echo "AUTH=Authorization: Bearer $TOKEN" >> "$GITHUB_ENV"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/sim/status)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8080/api/admin/reset)" = "403"
      - name: OMS 주문 → 수주 등록 확인
        run: |
          curl -fsS -H "$AUTH" -X POST "localhost:8080/api/sim/oms/order?large=true"
          test "$(curl -fsS localhost:8080/api/sales/orders | python3 -c 'import json,sys;print(len(json.load(sys.stdin)))')" = "1"
      - name: 스케쥴 확정 → 설비 실적 → 생산완료 확인
        run: |
          curl -fsS -H "$AUTH" -X POST localhost:8080/api/sim/speed -H 'content-type: application/json' -d '{"speed":60}'
          PLAN=$(curl -fsS -X POST localhost:8080/api/scheduling/plans | python3 -c 'import json,sys;print(json.load(sys.stdin)["plan_no"])')
          curl -fsS -X POST "localhost:8080/api/scheduling/plans/$PLAN/confirm"
          for i in $(seq 1 60); do
            S=$(curl -fsS localhost:8080/api/sales/orders | python3 -c 'import json,sys;print(json.load(sys.stdin)[0]["status"])')
            [ "$S" = "PRODUCED" ] && exit 0; sleep 3
          done
          echo "생산완료 안 됨: $S"; docker compose logs --tail 50 simulator backend; exit 1
      - name: 출하요청 → 로지스팟 배차 → 매출 마감 → 위아고 승인 → 수주 마감 확인
        run: |
          ORDER=$(curl -fsS localhost:8080/api/sales/orders | python3 -c 'import json,sys;print(json.load(sys.stdin)[0]["order_no"])')
          curl -fsS -X POST localhost:8080/api/shipping/requests -H 'content-type: application/json' -d "{\"order_no\":\"$ORDER\"}"
          wait_status() {
            for i in $(seq 1 40); do
              S=$(curl -fsS localhost:8080/api/sales/orders | python3 -c 'import json,sys;print(json.load(sys.stdin)[0]["status"])')
              [ "$S" = "$1" ] && return 0; sleep 2
            done
            echo "$1 안 됨: $S"; docker compose logs --tail 50 simulator backend; return 1
          }
          wait_status SHIPPED
          curl -fsS -X POST localhost:8080/api/settlement/close -H 'content-type: application/json' -d '{}'
          wait_status CLOSED
          curl -fsS -X POST localhost:8080/api/settlement/vouchers/export | head -3
          curl -fsS localhost:8080/api/cost/orders | python3 -c 'import json,sys;c=json.load(sys.stdin)[0];print(c["order_no"],c["cost_rate"]);assert c["cost_rate"]'
      - if: always()
        run: docker compose down -v
