name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  compose:
    # Oracle 23ai를 포함한 전체 스택을 실제로 띄워 I/F 흐름을 확인한다.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      ORACLE_PASSWORD: CiSys12345
      DB_PASSWORD: CiErp12345
      WEB_PORT: "8080"
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - name: 헬스체크
        run: |
          for i in $(seq 1 60); do curl -fsS localhost:8080/api/health && exit 0; sleep 5; done
          docker compose logs; exit 1
      - name: OMS 주문 → 수주 등록 확인
        run: |
          curl -fsS -X POST "localhost:8080/api/sim/oms/order?large=true"
          test "$(curl -fsS localhost:8080/api/sales/orders | python3 -c 'import json,sys;print(len(json.load(sys.stdin)))')" = "1"
      - if: always()
        run: docker compose down -v
