name: Deploy (Oracle Cloud)

# main에 머지되면 Oracle Cloud VM에 자동 배포. 수동 실행도 가능(Actions 탭 → Run workflow).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_SECRETS: ${{ secrets.OCI_HOST != '' && secrets.OCI_SSH_KEY != '' }}
    steps:
      - name: 설정 확인
        if: env.HAS_SECRETS != 'true'
        run: echo "::notice::OCI_HOST / OCI_SSH_KEY 시크릿이 없어 배포를 건너뜁니다 (docs/oracle-cloud-setup.md 참고)"
      - uses: actions/checkout@v4
        if: env.HAS_SECRETS == 'true'
      - name: SSH 준비
        if: env.HAS_SECRETS == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OCI_SSH_KEY }}" > ~/.ssh/id_oci && chmod 600 ~/.ssh/id_oci
          ssh-keyscan -H "${{ secrets.OCI_HOST }}" >> ~/.ssh/known_hosts
      - name: 소스 복사
        if: env.HAS_SECRETS == 'true'
        run: |
          rsync -az --delete --exclude .git --exclude .env --exclude node_modules \
            -e "ssh -i ~/.ssh/id_oci" ./ "${{ secrets.OCI_USER || 'ubuntu' }}@${{ secrets.OCI_HOST }}:~/yh-erp-demo/"
      - name: 배포 실행
        if: env.HAS_SECRETS == 'true'
        run: |
          ssh -i ~/.ssh/id_oci "${{ secrets.OCI_USER || 'ubuntu' }}@${{ secrets.OCI_HOST }}" \
            "ORACLE_PASSWORD='${{ secrets.ORACLE_PASSWORD }}' DB_PASSWORD='${{ secrets.DB_PASSWORD }}' bash ~/yh-erp-demo/scripts/deploy.sh"
      - name: 접속 주소
        if: env.HAS_SECRETS == 'true'
        run: echo "::notice::데모 주소 http://${{ secrets.OCI_HOST }}/"
