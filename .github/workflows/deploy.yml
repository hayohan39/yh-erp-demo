name: Deploy

# main에 머지되면 AWS Lightsail 서버에 자동 배포. 수동 실행도 가능(Actions 탭 → Run workflow).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_SECRETS: ${{ secrets.DEPLOY_HOST != '' && secrets.DEPLOY_SSH_KEY != '' }}
      TARGET: ${{ secrets.DEPLOY_USER || 'ubuntu' }}@${{ secrets.DEPLOY_HOST }}
    steps:
      - name: 설정 확인
        if: env.HAS_SECRETS != 'true'
        run: echo "::notice::DEPLOY_HOST / DEPLOY_SSH_KEY 시크릿이 없어 배포를 건너뜁니다 (docs/aws-lightsail-setup.md 참고)"
      - uses: actions/checkout@v4
        if: env.HAS_SECRETS == 'true'
      - name: SSH 준비
        if: env.HAS_SECRETS == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - name: 소스 복사
        if: env.HAS_SECRETS == 'true'
        run: |
          rsync -az --delete --exclude .git --exclude .env --exclude node_modules \
            -e "ssh -i ~/.ssh/id_deploy" ./ "$TARGET:~/yh-erp-demo/"
      - name: 배포 실행
        if: env.HAS_SECRETS == 'true'
        run: |
          ssh -i ~/.ssh/id_deploy "$TARGET" \
            "DB_PASSWORD='${{ secrets.DB_PASSWORD }}' bash ~/yh-erp-demo/scripts/deploy.sh"
      - name: 접속 주소
        if: env.HAS_SECRETS == 'true'
        run: echo "::notice::데모 주소 http://${{ secrets.DEPLOY_HOST }}/"
